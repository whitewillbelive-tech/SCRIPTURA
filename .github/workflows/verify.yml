name: Verify SCRIPTURA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  demo:
    name: Fixture, demo API, build and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate synthetic fixture and contract
        run: |
          python3 scripts/validate_fixture.py fixtures/demo_valid.json
          python3 scripts/check_fixture_policy.py
          python3 -m unittest discover -s tests -v
          node tests/rights-policy.test.cjs
          node tests/i2-authority.test.mjs
      - name: Validate generated synthetic-scale snapshots
        run: |
          python3 scripts/benchmark_d2.py --sources 10000
          python3 scripts/benchmark_d2.py --sources 100000
      - name: Validate complex I-1 synthetic datasets at scale
        run: |
          python3 scripts/benchmark_i1.py --records 10000
          python3 scripts/benchmark_i1.py --records 100000
      - name: Test demo API and audit
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright package
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium system dependencies
        run: npx --no-install playwright install-deps chromium
      - name: Download Chromium
        run: npx --no-install playwright install chromium
      - name: Test demo UI in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3107 > /tmp/scriptura-ci-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3107/ > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/scriptura-ci-web.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3107/ > /dev/null || { cat /tmp/scriptura-ci-web.log; exit 1; }
          node --test tests/ui.browser.cjs
          node --test tests/ui-i2-authority.browser.cjs
          # The J-2 harness generates only synthetic records and runs its own
          # loopback server; the D-8 research archive is never used in CI.
          node tests/ui-j2-candidate.browser.cjs
          # J-3 version switching/visibility uses synthetic input only.
          node tests/ui-j3-candidate.browser.cjs
          # K-1 boundary and visibility checks use synthetic data only.
          node tests/ui-k1-candidate.browser.cjs
          # K-1.1 bibliography policy and search use synthetic data only.
          node tests/ui-k11-metadata.browser.cjs

  postgres:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scriptura_test
          POSTGRES_PASSWORD: scriptura_ci_only
          POSTGRES_DB: scriptura_synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptura_test -d scriptura_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://scriptura_test:scriptura_ci_only@127.0.0.1:5432/scriptura_synthetic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply and test migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/001_schema.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/002_append_only.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/003_research_integrity.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/database_s1b1.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/database.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/reverify-alignments.sql
      - name: Verify rollback and reapplication on empty database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/003_research_integrity.down.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/002_append_only.down.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/001_schema.down.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/001_schema.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/002_append_only.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/003_research_integrity.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/database_s1b1.sql
      - name: Exercise PostgreSQL-backed HTTP API and approval audit
        run: node --test tests/pg-api.integration.mjs
      - name: Test I-2 authority API on isolated PostgreSQL
        run: node --test tests/i2-authority-api.integration.mjs
      - name: Seed an isolated synthetic-only dataset
        run: psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/seed_synthetic_pg.sql
      - name: Build
        run: npm run build
      - name: Install Playwright package
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium system dependencies
        run: npx --no-install playwright install-deps chromium
      - name: Download Chromium
        run: npx --no-install playwright install chromium
      - name: Test PostgreSQL UI in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3107 > /tmp/scriptura-ci-pg-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3107/explore > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/scriptura-ci-pg-web.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3107/explore > /dev/null || { cat /tmp/scriptura-ci-pg-web.log; exit 1; }
          node --test tests/ui-db.browser.cjs

  d2-staging:
    name: Synthetic D-2 isolated staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scriptura_stage_owner
          POSTGRES_PASSWORD: stage_owner_ci_only
          POSTGRES_DB: scriptura_staging_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptura_stage_owner -d scriptura_staging_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCRIPTURA_TEST_STAGING_OWNER_URL: postgresql://scriptura_stage_owner:stage_owner_ci_only@127.0.0.1:5432/scriptura_staging_ci
      SCRIPTURA_STAGING_DATABASE_URL: postgresql://scriptura_stage_writer:stage_writer_ci_only@127.0.0.1:5432/scriptura_staging_ci
      SCRIPTURA_STAGING_APPROVED: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging migration and guarded rollback on empty DB
        run: python3 tests/s1b2_staging_rollback.py
      - name: Apply I-1 research archive guard
        run: psql -X -v ON_ERROR_STOP=1 "$SCRIPTURA_TEST_STAGING_OWNER_URL" -f db/005_i1_research_guard.sql
      - name: Apply I-3 research archive guard
        run: psql -X -v ON_ERROR_STOP=1 "$SCRIPTURA_TEST_STAGING_OWNER_URL" -f db/007_i3_research_guard.sql
      - name: Apply J-1 research archive guard
        run: psql -X -v ON_ERROR_STOP=1 "$SCRIPTURA_TEST_STAGING_OWNER_URL" -f db/008_j1_research_guard.sql
      - name: Provision restricted synthetic staging writer
        run: |
          psql -X -v ON_ERROR_STOP=1 "$SCRIPTURA_TEST_STAGING_OWNER_URL" <<'SQL'
          CREATE ROLE scriptura_stage_writer LOGIN PASSWORD 'stage_writer_ci_only';
          GRANT CONNECT ON DATABASE scriptura_staging_ci TO scriptura_stage_writer;
          GRANT USAGE ON SCHEMA scriptura_d2_stage TO scriptura_stage_writer;
          GRANT SELECT, INSERT ON scriptura_d2_stage.snapshots, scriptura_d2_stage.records TO scriptura_stage_writer;
          SQL
      - name: Verify synthetic staging against PostgreSQL
        run: python3 tests/s1b2_staging_pg.py
      - name: Verify synthetic staging CLI is repeatable
        run: |
          python3 scripts/stage_synthetic.py
          python3 scripts/stage_synthetic.py
      - name: Verify I-1 guard in a separate synthetic database
        env:
          SCRIPTURA_I1_OWNER_URL: postgresql://scriptura_stage_owner:stage_owner_ci_only@127.0.0.1:5432/scriptura_staging_i1_guard
        run: |
          createdb --maintenance-db="$SCRIPTURA_TEST_STAGING_OWNER_URL" scriptura_staging_i1_guard
          psql -X -v ON_ERROR_STOP=1 "$SCRIPTURA_I1_OWNER_URL" -f db/004_d2_staging.sql
          SCRIPTURA_TEST_STAGING_OWNER_URL="$SCRIPTURA_I1_OWNER_URL" python3 tests/i1_staging_guard.py
      - name: Verify I-3 guard and rollback in a separate synthetic database
        env:
          I3_OWNER_URL: postgresql://scriptura_stage_owner:stage_owner_ci_only@127.0.0.1:5432/scriptura_staging_i3_guard
          I3_WRITER_URL: postgresql://scriptura_stage_writer:stage_writer_ci_only@127.0.0.1:5432/scriptura_staging_i3_guard
        run: |
          createdb --maintenance-db="$SCRIPTURA_TEST_STAGING_OWNER_URL" scriptura_staging_i3_guard
          psql -X -v ON_ERROR_STOP=1 "$I3_OWNER_URL" -f db/004_d2_staging.sql
          psql -X -v ON_ERROR_STOP=1 "$I3_OWNER_URL" -f db/005_i1_research_guard.sql
          psql -X -v ON_ERROR_STOP=1 "$I3_OWNER_URL" <<'SQL'
          GRANT CONNECT ON DATABASE scriptura_staging_i3_guard TO scriptura_stage_writer;
          GRANT USAGE ON SCHEMA scriptura_d2_stage TO scriptura_stage_writer;
          GRANT SELECT, INSERT ON scriptura_d2_stage.snapshots, scriptura_d2_stage.records TO scriptura_stage_writer;
          SQL
          SCRIPTURA_TEST_STAGING_OWNER_URL="$I3_OWNER_URL" SCRIPTURA_STAGING_DATABASE_URL="$I3_WRITER_URL" python3 tests/i3_staging_pg.py
      - name: Verify J-1 guard and rollback in a separate synthetic database
        env:
          J1_OWNER_URL: postgresql://scriptura_stage_owner:stage_owner_ci_only@127.0.0.1:5432/scriptura_staging_j1_guard
          J1_WRITER_URL: postgresql://scriptura_stage_writer:stage_writer_ci_only@127.0.0.1:5432/scriptura_staging_j1_guard
        run: |
          createdb --maintenance-db="$SCRIPTURA_TEST_STAGING_OWNER_URL" scriptura_staging_j1_guard
          psql -X -v ON_ERROR_STOP=1 "$J1_OWNER_URL" -f db/004_d2_staging.sql
          psql -X -v ON_ERROR_STOP=1 "$J1_OWNER_URL" -f db/005_i1_research_guard.sql
          psql -X -v ON_ERROR_STOP=1 "$J1_OWNER_URL" -f db/007_i3_research_guard.sql
          psql -X -v ON_ERROR_STOP=1 "$J1_OWNER_URL" <<'SQL'
          GRANT CONNECT ON DATABASE scriptura_staging_j1_guard TO scriptura_stage_writer;
          GRANT USAGE ON SCHEMA scriptura_d2_stage TO scriptura_stage_writer;
          GRANT SELECT, INSERT ON scriptura_d2_stage.snapshots, scriptura_d2_stage.records TO scriptura_stage_writer;
          SQL
          SCRIPTURA_TEST_STAGING_OWNER_URL="$J1_OWNER_URL" SCRIPTURA_STAGING_DATABASE_URL="$J1_WRITER_URL" python3 tests/j1_staging_pg.py

  i2-authority-db:
    name: I-2 synthetic authority evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scriptura_i2_owner
          POSTGRES_PASSWORD: scriptura_i2_ci_only
          POSTGRES_DB: scriptura_i2_synthetic_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptura_i2_owner -d scriptura_i2_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      I2_TEST_DATABASE_URL: postgresql://scriptura_i2_owner:scriptura_i2_ci_only@127.0.0.1:5432/scriptura_i2_synthetic_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations in isolated synthetic database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/001_schema.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/002_append_only.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/003_research_integrity.sql
      - name: Verify authority migration, evidence and guarded rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/006_authority_evidence.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f tests/i2_authority_db.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f tests/i2_safe_view_review.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/006_authority_evidence.down.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f db/006_authority_evidence.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f tests/i2_authority_db.sql
          psql -X -v ON_ERROR_STOP=1 "$I2_TEST_DATABASE_URL" -f tests/i2_safe_view_review.sql
